name: HosannaMedia Windows test installer
on:
  workflow_dispatch:
  push:
    branches:
      - hosannamedia-branding

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build HosannaMedia
        run: npm run build
      - name: Package unsigned Windows installer
        run: npx electron-builder --config config/building/electron-builder.local.yaml --win nsis --x64 --publish never
      - name: Upload test installer
        uses: actions/upload-artifact@v4
        with:
          name: HosannaMedia-Windows-x64-test
          path: dist/HosannaMedia-*.exe
          if-no-files-found: error
          retention-days: 14
